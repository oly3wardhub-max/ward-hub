<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sacrament Meeting Invitation</title><meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icons/icon-192.png"><link rel="stylesheet" href="app.css?v=2.5.0">
</head><body><main class="welcome" id="m"><div class="spin" style="margin:0 auto"></div></main>
<script src="config.js?v=2.5.0"></script>
<script>
(async function(){
  const m=document.getElementById('m'), t=new URLSearchParams(location.search).get('t')||'', api=(window.WARD_HUB_CONFIG||{}).api;
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const post=o=>fetch(api,{method:'POST',body:JSON.stringify(o)}).then(r=>r.json());
  let d; try{ d=await post({action:'invite',t}); }catch(e){ m.innerHTML='<p>Couldn\'t load this invitation. Check your connection and try again.</p>'; return; }
  if(!d.ok){ m.innerHTML='<h1>Invitation</h1><p>'+esc(d.error||'This link is no longer valid.')+'</p>'; return; }
  const when=new Date(d.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const done=s=>{ m.innerHTML='<h1>'+(s==='Accepted'?'Thank you!':'Thanks for letting us know')+'</h1><p>'+(s==='Accepted'?'We\'ve noted your yes for '+esc(when)+'. The bishopric will follow up with any details.':'We\'ve let the bishopric know. No need to do anything else.')+'</p>'+(s==='Accepted'&&d.prompt?'<div class="list" style="text-align:left"><div class="row wrap"><div class="main"><div class="s" style="white-space:pre-wrap;color:var(--text);font-size:15px">'+esc(d.prompt)+'</div></div></div></div>':''); };
  m.innerHTML='<h1>Hi '+esc(d.first)+'</h1><p>'+esc(d.ward)+' sacrament meeting<br><b>'+esc(when)+'</b>'+(d.time?' · '+esc(d.time):'')+'<br>'+esc(d.what)+(d.minutes?' · about '+esc(d.minutes)+' minutes':'')+'</p>'+
    (d.status==='Accepted'||d.status==='Declined'?'<p>You answered: <b>'+(d.status==='Accepted'?'Yes':'No')+'</b>. You can change it below.</p>':'')+
    '<div class="list"><div class="field col"><label>Anything to add? (optional)</label><textarea id="n" style="min-height:70px"></textarea></div></div>'+
    '<button class="btn" id="y" style="margin-top:14px">Yes, I can</button><button class="btn gray" id="no" style="margin-top:10px">I\'m not able to</button>';
  const send=async yes=>{ document.getElementById('y').disabled=document.getElementById('no').disabled=true; try{ const r=await post({action:'answer',t,yes,note:document.getElementById('n').value}); if(r.ok) done(r.status); else m.innerHTML='<p>'+esc(r.error)+'</p>'; }catch(e){ m.innerHTML='<p>Couldn\'t send. Please try again.</p>'; } };
  document.getElementById('y').onclick=()=>send(true); document.getElementById('no').onclick=()=>send(false);
})();
</script></body></html>
